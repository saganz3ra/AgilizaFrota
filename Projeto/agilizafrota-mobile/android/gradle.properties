org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ==========================================================================
# Compilacao do Kotlin no Windows
#
# A compilacao incremental do Kotlin usa arquivos mapeados em memoria
# (*.tab) para o cache. No Windows - especialmente em disco secundario e
# com espaco no caminho, como "D:\Agiliza Frota" - o sistema nao libera
# esses arquivos a tempo, e a compilacao falha com
# "Could not close incremental caches" / "Storage is already registered".
#
# Desligar o modo incremental faz o Kotlin recompilar tudo a cada build:
# fica mais lento, mas para de quebrar. Como as classes Kotlin aqui vem
# apenas dos plugins do Firebase (nosso codigo e todo em Dart), a perda de
# velocidade e pequena.
#
# A estrategia "in-process" evita o daemon separado do Kotlin, que foi
# justamente quem falhou ("Daemon compilation failed").
# ==========================================================================
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Mantem o daemon do Gradle vivo entre builds (compensa parte do tempo
# perdido acima).
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
